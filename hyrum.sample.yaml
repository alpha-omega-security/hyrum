# Hyrum configuration. Copy this file to <target>/hyrum.yaml for automatic
# discovery, or pass it explicitly with `hyrum gen --config <path> ...` or
# `hyrum surface --config <path> ...`.
# All keys are optional. Explicit command-line flags win over config values,
# which win over built-in defaults. Unknown keys and incorrect types are
# errors.

# Harness backend for LLM-driven skills. Ignored in an automatically discovered
# target config; pass --config explicitly to authorize provider selection.
# backend: claude          # claude | codex | copilot | opencode

# Per-skill model tier. The selected backend maps mid/high/max to its own
# models. Keys match the model-driven skills under skills/. Also ignored in an
# automatically discovered target config.
# models:
#   hyrum-usage:    mid
#   hyrum-history:  mid
#   hyrum-generate: high
#   hyrum-validate: mid

# Where generated tests are written. Relative paths use the target repository;
# automatic target configs must keep output inside that repository. Explicit
# --config files may also use absolute paths and paths beginning with ~/.
# out: tests/hyrum

# Name used below the work root and in tests/hyrum/<dependency>/from_<name>.
# Hyrum normally reads one package name from the target's root manifest. Nested
# targets add a suffix derived from their Git-relative path. The fallback is the
# repository name plus that path. An explicit value must contain one path
# component. `gen --target-name` wins.
# target_name: apache-airflow-core

# Working directory for dependency clones and skill workspaces. This setting is
# ignored when the config is auto-discovered; pass --config explicitly to trust
# it. Relative paths use the directory containing that explicit config file.
# work: ~/.cache/hyrum/work

# Maximum rendered size of each dependency source outline. Hyrum selects whole
# files related to observed usage and fails before a model run if required
# source evidence cannot fit.
# outline_bytes: 262144

# Per-dependency overrides. Keys are package names or purls.
# deps:
#   ws:
#     baseline: "8.17.1"   # staged/recorded baseline; target files are unchanged
#     skip: false
#   aiosqlite:
#     activations:          # exact quoted strings that select this dependency
#       - aiosqlite
#   pkg:npm/lodash:
#     skip: true           # omitted by default; explicit --dep still includes it
